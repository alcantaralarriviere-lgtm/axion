<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B">
  <meta name="description" content="AXION · partes diarios y control de maquinaria pesada">
  <title>AXION</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono-192.png">
  <link rel="apple-touch-icon" href="icono-192.png">
  <!-- sin fuentes externas: la app abre al instante aun con poca señal (usa la letra del celular) -->
  <link rel="preload" as="image" href="fondo-movil.webp" type="image/webp">
  <link rel="stylesheet" href="styles.css">
  <!-- modo de color antes de dibujar (evita un destello oscuro al abrir en modo claro) -->
  <script>try { var t = localStorage.getItem('axion_tema') || 'oscuro'; if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro'; document.documentElement.setAttribute('data-tema', t); } catch (e) {}</script>
</head>
<body>
  <div id="app" aria-live="polite"><main class="ingreso"><div class="logo">AXION</div><p class="lema">Cargando…</p></main></div>
  <dialog id="dlg" aria-modal="true"></dialog>
  <!-- No usar "hidden"/display:none: algunos navegadores (Safari) no abren la cámara desde un campo oculto así. -->
  <input id="camara" class="selector-foto" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
  <input id="galeria" class="selector-foto" type="file" accept="image/*" tabindex="-1" aria-hidden="true">
  <script src="config.js"></script>
  <script src="reglas.js"></script>
  <script src="nucleo.js"></script>
  <script src="camara.js"></script>
  <script src="app.js"></script>
</body>
</html>
